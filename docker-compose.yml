# Full stack for the streaming pipeline.
#
#   kafka      message broker (KRaft mode - no ZooKeeper needed)
#   minio      S3-compatible object store: bronze / silver / gold layers
#   elasticsearch + kibana   serving layer and dashboards
#   spark      master + one worker, with the project mounted at /opt/project
#
# Bring it up with:  docker compose up -d
# Memory: Elasticsearch and Spark together want ~6GB. On Docker Desktop, raise
# the VM memory limit to at least 8GB or Elasticsearch will be OOM-killed on
# start.

name: biu-tickets

services:
  kafka:
    image: soldevelo/kafka:3.7
    container_name: tickets-kafka
    ports:
      - "9092:9092"   # host clients (the producer)
    environment:
      # KRaft: this single node is both broker and controller.
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092"
      # Two advertised listeners because containers reach the broker at
      # kafka:29092 while the host reaches it at localhost:9092. Getting this
      # wrong is the classic "connects, then times out on produce" failure.
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: tickets-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console -> http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: creates the lake bucket, then exits. `depends_on` elsewhere waits
  # for it to complete, so no job can start before the bucket exists.
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: tickets-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-lake} &&
      echo 'bucket ready' "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: tickets-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # Security off: this is a local teaching stack, not an exposed service.
      # Never do this on a reachable network.
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx2g"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: tickets-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: tickets-spark:latest
    container_name: tickets-spark
    ports:
      - "8080:8080"   # Spark master UI
      - "4040:4040"   # Spark application UI (while a job is running)
    environment:
      SPARK_MODE: master
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lake}
      ES_URL: http://elasticsearch:9200
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      PYTHONPATH: /opt/project/src
    volumes:
      - ./:/opt/project
      - ivy-cache:/opt/bitnami/spark/.ivy2
    working_dir: /opt/project
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  spark-worker:
    image: tickets-spark:latest
    container_name: tickets-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_WORKER_MEMORY: 3G
      SPARK_WORKER_CORES: "2"
      PYTHONPATH: /opt/project/src
    volumes:
      - ./:/opt/project
      - ivy-cache:/opt/bitnami/spark/.ivy2
    depends_on:
      - spark

volumes:
  kafka-data:
  minio-data:
  es-data:
  ivy-cache:
