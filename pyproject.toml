[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickets"
version = "1.0.0"
description = "Streaming ELT and semantic search over customer IT support tickets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yael Dorin" }]

# Kept deliberately small: these are the only hard requirements. Spark, Kafka,
# Elasticsearch and FastAPI live in requirements.txt because the offline runner
# -- which is what most people run first -- does not need them.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
pipeline = [
    "pyspark==3.5.1",
    "kafka-python>=2.0.2",
    "elasticsearch>=8.13,<9",
]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
ai = [
    "sentence-transformers>=2.7",
    "anthropic>=0.25",
]
dev = ["pytest>=8.0"]

[project.scripts]
# After `pip install -e .` these work from any directory.
tickets-pipeline = "tickets.offline_pipeline:main"
tickets-producer = "tickets.ingest.producer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
