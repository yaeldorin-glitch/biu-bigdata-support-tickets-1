# Low-memory stack — for machines with ~8GB of RAM in total.
#
#   docker compose -f docker-compose.slim.yml up -d
#
# The default docker-compose.yml assumes Docker itself can have 8GB. On a laptop
# with 8GB total, WSL 2 gets about 3.9GB, and that has to hold everything. This
# file fits the same pipeline into a ~3.8GB peak by making four cuts:
#
#   1. Elasticsearch heap 2GB -> 512MB. Fine for 28k documents; it only matters
#      for large aggregations and big kNN candidate lists.
#   2. Kafka heap -> 512MB. It is a single broker replaying one topic.
#   3. Kibana removed entirely. It is a Node app that idles at ~800MB and adds
#      nothing the FastAPI /kpis endpoint does not already show.
#   4. The separate Spark worker is gone. Spark runs in local mode inside one
#      container (SPARK_MASTER=local[2]) instead of master + worker, which
#      removes a whole JVM.
#
# What you lose: the Kibana dashboards, and headroom. What you keep: Kafka,
# Spark Structured Streaming, MinIO and Elasticsearch — all four course
# technologies, and the entire data flow.
#
# Close Chrome before running this. Seriously — it is often the difference
# between the stack starting and the OOM killer taking Elasticsearch.

name: biu-tickets-slim

services:
  kafka:
    image: soldevelo/kafka:3.7.1-debian-12-r0
    container_name: tickets-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Half the default heap. One broker, one topic, no replication.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Cap log segment retention so a replay does not grow the volume forever.
      KAFKA_CFG_LOG_RETENTION_HOURS: "6"
    mem_limit: 800m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: tickets-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    mem_limit: 300m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: tickets-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-lake} &&
      echo 'bucket ready' "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: tickets-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # 512MB heap. Elasticsearch wants heap == half of container memory, so the
      # 1.3GB limit below leaves room for Lucene's off-heap file cache.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # Machine learning is on by default and costs memory we do not have.
      xpack.ml.enabled: "false"
      bootstrap.memory_lock: "false"
    mem_limit: 1200m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # No master/worker split: Spark runs in local mode inside this one container,
  # which removes an entire JVM. `tail -f /dev/null` keeps it alive so we can
  # `docker compose exec` into it to submit jobs.
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: tickets-spark:latest
    container_name: tickets-spark
    command: tail -f /dev/null
    ports:
      - "4040:4040"
    environment:
      SPARK_MASTER: "local[2]"
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lake}
      ES_URL: http://elasticsearch:9200
      # Force the offline embedding backend inside Spark: loading a 471MB
      # transformer into every executor will not fit in this budget.
      EMBEDDING_BACKEND: offline
      # The offline backend needs a *fitted* model -- it cannot fit itself on
      # one streaming micro-batch. Fit it once with:
      #   EMBEDDING_BACKEND=offline tickets-pipeline --limit 3000
      # which writes this path (see docs/DEMO.md). Without it, streaming fails
      # with "needs either a fitted model file or a corpus to fit on".
      OFFLINE_EMBEDDING_MODEL: /opt/project/output/offline_embedding_model.joblib
      LLM_PROVIDER: none
      PYTHONPATH: /opt/project/src
      SPARK_SUBMIT_OPTS: "-Xss4m"
    volumes:
      - ./:/opt/project
      - ivy-cache:/opt/bitnami/spark/.ivy2
    working_dir: /opt/project
    mem_limit: 1500m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  es-data:
  ivy-cache:
